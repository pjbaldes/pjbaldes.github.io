<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Speed Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            cursor: none;
        }
        
        canvas {
            display: block;
            background: radial-gradient(circle, #001122 0%, #000000 100%);
        }
        
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            z-index: 100;
            text-shadow: 0 0 10px #00ffff;
        }
    </style>
</head>
<body>

    
    <canvas id="canvas"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas to fullscreen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Star properties
        const stars = [];
        const numStars = 800;
        let speed = 2;
        let maxSpeed = 15;
        let acceleration = 0.02;
        
        // Direction shift properties
        let shiftX = 0;
        let shiftY = 0;
        let targetShiftX = 0;
        let targetShiftY = 0;
        let shiftTimer = 0;
        let shiftDuration = 0;
        
        // Create initial stars
        function createStar() {
            return {
                x: (Math.random() - 0.5) * 2000,
                y: (Math.random() - 0.5) * 2000,
                z: Math.random() * 1000,
                prevX: 0,
                prevY: 0,
                brightness: Math.random() * 0.8 + 0.2
            };
        }
        
        // Initialize stars
        for (let i = 0; i < numStars; i++) {
            stars.push(createStar());
        }
        
        // Handle random direction shifts
        function updateDirectionShift() {
            shiftTimer++;
            
            // Create new random shift every 120-300 frames
            if (shiftTimer > shiftDuration) {
                targetShiftX = (Math.random() - 0.5) * 4;
                targetShiftY = (Math.random() - 0.5) * 4;
                shiftDuration = Math.random() * 180 + 120;
                shiftTimer = 0;
            }
            
            // Smoothly interpolate to target shift
            shiftX += (targetShiftX - shiftX) * 0.02;
            shiftY += (targetShiftY - shiftY) * 0.02;
        }
        
        // Automatic speed variation
        let speedTimer = 0;
        let targetSpeed = 2;
        
        // Animation loop
        function animate() {
            // Clear canvas with fade effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update direction shifts
            updateDirectionShift();
            
            // Auto-vary speed for dynamic effect
            speedTimer++;
            if (speedTimer > 200 + Math.random() * 300) {
                targetSpeed = 2 + Math.random() * 8;
                speedTimer = 0;
            }
            
            // Smoothly interpolate to target speed
            speed += (targetSpeed - speed) * 0.01;
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Update and draw stars
            for (let i = 0; i < stars.length; i++) {
                const star = stars[i];
                
                // Store previous position for trail effect
                const x = (star.x / star.z) * 200 + centerX + shiftX * (1000 - star.z) / 10;
                const y = (star.y / star.z) * 200 + centerY + shiftY * (1000 - star.z) / 10;
                
                star.prevX = x;
                star.prevY = y;
                
                // Move star towards viewer
                star.z -= speed * (star.brightness + 0.5);
                
                // Reset star if it's too close
                if (star.z <= 0) {
                    star.x = (Math.random() - 0.5) * 2000;
                    star.y = (Math.random() - 0.5) * 2000;
                    star.z = 1000;
                    star.brightness = Math.random() * 0.8 + 0.2;
                }
                
                // Calculate new position
                const newX = (star.x / star.z) * 200 + centerX + shiftX * (1000 - star.z) / 10;
                const newY = (star.y / star.z) * 200 + centerY + shiftY * (1000 - star.z) / 10;
                
                // Skip if star is off screen
                if (newX < -50 || newX > canvas.width + 50 || 
                    newY < -50 || newY > canvas.height + 50) {
                    continue;
                }
                
                // Calculate star size and opacity based on distance
                const size = (1000 - star.z) / 1000 * 3;
                const opacity = star.brightness * (1000 - star.z) / 1000;
                
                // Create gradient for glow effect
                const gradient = ctx.createRadialGradient(newX, newY, 0, newX, newY, size * 2);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${opacity})`);
                gradient.addColorStop(0.5, `rgba(200, 220, 255, ${opacity * 0.5})`);
                gradient.addColorStop(1, 'rgba(100, 150, 255, 0)');
                
                // Draw star trail (light speed effect)
                if (speed > 3) {
                    ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.3})`;
                    ctx.lineWidth = size * 0.5;
                    ctx.beginPath();
                    ctx.moveTo(star.prevX, star.prevY);
                    ctx.lineTo(newX, newY);
                    ctx.stroke();
                }
                
                // Draw star
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(newX, newY, size, 0, Math.PI * 2);
                ctx.fill();
                
                // Add extra glow for bright stars
                if (star.brightness > 0.7) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.2})`;
                    ctx.beginPath();
                    ctx.arc(newX, newY, size * 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // Add speed lines effect during high speed
            if (speed > 6) {
                ctx.strokeStyle = `rgba(255, 255, 255, ${(speed - 6) * 0.02})`;
                ctx.lineWidth = 1;
                for (let i = 0; i < 20; i++) {
                    const angle = (Math.PI * 2 / 20) * i;
                    const x1 = centerX + Math.cos(angle) * 50;
                    const y1 = centerY + Math.sin(angle) * 50;
                    const x2 = centerX + Math.cos(angle) * 200;
                    const y2 = centerY + Math.sin(angle) * 200;
                    
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        // Start animation
        animate();
    </script>
</body>
</html>
