<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reticulated Pattern Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #fff;
            overflow: hidden;
            cursor: none;
        }
        
        canvas {
            display: block;
            background: #fff;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        let time = Math.random() * 1000; // Random starting time
        const scale = 0.005;
        const threshold = 0.1;
        const timeOffset = Math.random() * Math.PI * 2; // Random phase offset
        const noiseOffsetX = Math.random() * 1000; // Random spatial offset
        const noiseOffsetY = Math.random() * 1000;
        
        // Improved 2D noise function with random offsets
        function noise(x, y, t) {
            const a = Math.sin((x + noiseOffsetX) * 0.01 + (t + timeOffset) * 0.3) * Math.cos((y + noiseOffsetY) * 0.01 + (t + timeOffset) * 0.2);
            const b = Math.sin((x + noiseOffsetX) * 0.007 + (y + noiseOffsetY) * 0.013 + (t + timeOffset) * 0.4) * 0.5;
            const c = Math.sin((x + noiseOffsetX) * 0.013 + (y + noiseOffsetY) * 0.007 + (t + timeOffset) * 0.1) * 0.3;
            return a + b + c;
        }
        
        // Fractal noise for more complex patterns
        function fractalNoise(x, y, t) {
            let value = 0;
            let amplitude = 1;
            let frequency = 1;
            
            for (let i = 0; i < 4; i++) {
                value += noise(x * frequency, y * frequency, t) * amplitude;
                amplitude *= 0.5;
                frequency *= 2;
            }
            
            return value;
        }
        
        function animate() {
            // Check if canvas is properly sized
            if (canvas.width === 0 || canvas.height === 0) {
                resizeCanvas();
                requestAnimationFrame(animate);
                return;
            }
            
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            time += 0.01;
            
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let x = 0; x < canvas.width; x += 1) {
                for (let y = 0; y < canvas.height; y += 1) {
                    // Create cellular/reticulated pattern with higher density
                    const noiseValue = fractalNoise(x * 0.5, y * 0.5, time);
                    const cellPattern = Math.sin(noiseValue * 12) * 0.5 + 0.5;
                    
                    // Create branching structure with higher density
                    const branchX = Math.sin(x * 0.03 + time) * 15;
                    const branchY = Math.cos(y * 0.03 + time) * 15;
                    const branchNoise = fractalNoise((x + branchX) * 0.5, (y + branchY) * 0.5, time * 0.5);
                    
                    // Combine patterns for reticulated effect with random threshold variation
                    const combined = (cellPattern + branchNoise * 0.3) * 0.5;
                    const threshold1 = 0.4 + Math.sin(time * 2 + timeOffset) * 0.1;
                    
                    let r, g, b;
                    
                    // Inverted colors - white background, black shapes
                    if (combined > threshold1) {
                        r = 0;
                        g = 0;
                        b = 0;
                    } else {
                        r = 255;
                        g = 255;
                        b = 255;
                    }
                    
                    // Draw pixel by pixel for higher density
                    if (x < canvas.width && y < canvas.height) {
                        const index = (y * canvas.width + x) * 4;
                        data[index] = r;
                        data[index + 1] = g;
                        data[index + 2] = b;
                        data[index + 3] = 255;
                    }
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
