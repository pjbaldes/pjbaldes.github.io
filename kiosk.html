<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Website Rotator for Raspberry Pi Kiosk</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #frame {
      width: 100%;
      height: 100%;
      border: none;
    }
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      font-size: 24px;
      z-index: 10;
      text-align: center;
      padding: 1em;
    }
    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #fff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="container">
    <iframe id="frame" src="about:blank" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <div id="loading">
      <div>
        <div class="spinner"></div>
        Loading website...
      </div>
    </div>
  </div>

  <script>
    const CONFIG_URL = 'https://pjbaldes.github.io/screensaver-config.json';
    const MIN_REFRESH_TIME = 15;
    const MAX_REFRESH_TIME = 120;
    const DEBUG = true;
    const LOAD_TIMEOUT = 120000; // 2 minutes for slow loading content
    const MAX_RETRIES = 3;

    let websiteList = [];
    let currentIndex = -1;
    let refreshTimer = null;
    let loadTimer = null;
    let retryCount = 0;
    let currentUrl = null;

    function log(...args) {
      if (DEBUG) {
        console.log(new Date().toISOString(), ...args);
      }
    }

    function updateLoadingText(text) {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.innerHTML = `<div><div class="spinner"></div>${text}</div>`;
      }
    }

    function getSecureRandomInt(min, max) {
      const range = max - min + 1;
      const maxRange = 0xFFFFFFFF;
      const array = new Uint32Array(1);
      let randomNumber;
      do {
        window.crypto.getRandomValues(array);
        randomNumber = array[0];
      } while (randomNumber > maxRange - (maxRange % range));
      return min + (randomNumber % range);
    }

    function selectRandomWebsite() {
      if (websiteList.length === 0) return null;
      let newIndex;
      do {
        newIndex = getSecureRandomInt(0, websiteList.length - 1);
      } while (newIndex === currentIndex && websiteList.length > 1);
      currentIndex = newIndex;
      log(`Selected website index ${currentIndex}: ${websiteList[currentIndex]}`);
      return websiteList[currentIndex];
    }

    function hideLoading() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'none';
      }
    }

    function showLoading() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'flex';
      }
    }

    function onLoadSuccess(url) {
      log(`Successfully loaded: ${url}`);
      hideLoading();
      retryCount = 0;
      
      // Clear any existing timers
      if (loadTimer) {
        clearTimeout(loadTimer);
        loadTimer = null;
      }
      
      scheduleNextRefresh();
    }

    function onLoadFailure(url, error) {
      log(`Failed to load: ${url}`, error);
      console.error(`404 or loading error for URL: ${url}`);
      
      if (retryCount < MAX_RETRIES) {
        retryCount++;
        log(`Retrying ${url} (attempt ${retryCount}/${MAX_RETRIES})`);
        updateLoadingText(`Retrying: ${url}<br>Attempt ${retryCount}/${MAX_RETRIES}`);
        setTimeout(() => loadWebsite(url), 3000);
      } else {
        log(`Max retries reached for ${url}, moving to next`);
        console.error(`Max retries reached for ${url}, moving to next URL`);
        retryCount = 0;
        updateLoadingText('Loading failed. Trying next website...');
        setTimeout(() => {
          const website = selectRandomWebsite();
          if (website) {
            loadWebsite(website);
          }
        }, 2000);
      }
    }

    function loadWebsite(url) {
      currentUrl = url;
      const frame = document.getElementById('frame');
      
      showLoading();
      updateLoadingText(`Loading: ${url}<br>Please wait, some content takes time to load...`);
      log(`Loading website: ${url}`);
      
      // Clear any existing timers
      if (loadTimer) {
        clearTimeout(loadTimer);
      }
      if (refreshTimer) {
        clearTimeout(refreshTimer);
      }

      // Set up load timeout - be patient for slow content
      loadTimer = setTimeout(() => {
        log(`Load timeout for ${url} after ${LOAD_TIMEOUT/1000} seconds`);
        
        // Check if iframe has any content before treating as failure
        try {
          const iframeDoc = frame.contentDocument || frame.contentWindow.document;
          if (iframeDoc && iframeDoc.readyState === 'complete') {
            // If document is complete, consider it loaded even if slow
            log(`Iframe document complete for ${url}, considering it loaded`);
            onLoadSuccess(url);
            return;
          }
        } catch (e) {
          // Cross-origin iframe, can't check content - assume it's loading
          log(`Cross-origin iframe for ${url}, assuming it's loading`);
          onLoadSuccess(url);
          return;
        }
        
        // Truly failed to load
        onLoadFailure(url, 'Load timeout');
      }, LOAD_TIMEOUT);

      // Set up iframe event handlers
      frame.onload = function() {
        log(`Iframe onload triggered for: ${url}`);
        
        // Additional check for actual content
        setTimeout(() => {
          try {
            const iframeDoc = frame.contentDocument || frame.contentWindow.document;
            if (iframeDoc && iframeDoc.title && iframeDoc.title.toLowerCase().includes('404')) {
              throw new Error('404 page detected');
            }
          } catch (e) {
            // Cross-origin - assume it's good if onload fired
            log(`Cross-origin iframe loaded: ${url}`);
          }
          
          onLoadSuccess(url);
        }, 1000); // Small delay to let content settle
      };

      frame.onerror = function(e) {
        log(`Iframe onerror triggered for: ${url}`, e);
        onLoadFailure(url, 'Iframe error event');
      };

      // Start loading
      frame.src = url;
    }

    function scheduleNextRefresh() {
      if (refreshTimer) {
        clearTimeout(refreshTimer);
      }
      const refreshTime = getSecureRandomInt(MIN_REFRESH_TIME, MAX_REFRESH_TIME) * 1000;
      log(`Next refresh in ${refreshTime / 1000} seconds`);
      refreshTimer = setTimeout(() => {
        const website = selectRandomWebsite();
        if (website) {
          loadWebsite(website);
        }
      }, refreshTime);
    }

    async function fetchConfig() {
      log('Fetching config from:', CONFIG_URL);
      updateLoadingText('Loading configuration...');
      
      try {
        const response = await fetch(CONFIG_URL, {
          mode: 'cors',
          cache: 'no-cache',
          credentials: 'omit',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!response.ok) throw new Error(`Fetch failed: ${response.status}`);

        const text = await response.text();
        log('Received response:', text.substring(0, 100) + '...');
        const data = JSON.parse(text);

        if (data && Array.isArray(data.urls)) {
          websiteList = data.urls;
          log(`Loaded ${websiteList.length} websites:`, websiteList);
        } else {
          throw new Error('Invalid config format');
        }
      } catch (err) {
        log('Config load failed:', err);
        updateLoadingText(`Failed to load config: ${err.message}<br>Refreshing in 30 seconds...`);
        setTimeout(() => {
          window.location.reload();
        }, 30000);
        return;
      }

      if (currentIndex === -1) {
        log('Starting website rotation');
        const website = selectRandomWebsite();
        if (website) {
          loadWebsite(website);
        }
      }
    }

    window.addEventListener('load', function () {
      log('Page loaded, initializing...');
      fetchConfig();
    });

    // Refresh every hour to prevent memory issues
    setTimeout(() => {
      log('Refreshing page after 1 hour');
      window.location.reload();
    }, 3600000);

    // Handle page visibility changes
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        log('Page hidden, pausing timers');
        if (refreshTimer) clearTimeout(refreshTimer);
        if (loadTimer) clearTimeout(loadTimer);
      } else {
        log('Page visible, resuming');
        if (currentUrl) {
          scheduleNextRefresh();
        }
      }
    });
  </script>
</body>
</html>
