<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Website Rotator for Raspberry Pi Kiosk</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #frame {
      width: 100%;
      height: 100%;
      border: none;
    }
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      font-size: 24px;
      z-index: 10;
      text-align: center;
      padding: 1em;
    }
  </style>
</head>
<body>
  <div id="container">
    <iframe id="frame" src="about:blank" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <div id="loading">Loading website...</div>
  </div>

  <script>
    const CONFIG_URL = 'https://pjbaldes.github.io/screensaver-config.json';
    const MIN_REFRESH_TIME = 15;
    const MAX_REFRESH_TIME = 120;
    const DEBUG = true;

    let websiteList = [];
    let currentIndex = -1;
    let refreshTimer = null;

    function log(...args) {
      if (DEBUG) {
        console.log(...args);
        const loading = document.getElementById('loading');
        if (loading) {
          loading.innerHTML += "<br>" + args.join(' ');
        }
      }
    }

    function getSecureRandomInt(min, max) {
      const range = max - min + 1;
      const maxRange = 0xFFFFFFFF;
      const array = new Uint32Array(1);
      let randomNumber;
      do {
        window.crypto.getRandomValues(array);
        randomNumber = array[0];
      } while (randomNumber > maxRange - (maxRange % range));
      return min + (randomNumber % range);
    }

    function selectRandomWebsite() {
      if (websiteList.length === 0) return null;
      let newIndex;
      do {
        newIndex = getSecureRandomInt(0, websiteList.length - 1);
      } while (newIndex === currentIndex && websiteList.length > 1);
      currentIndex = newIndex;
      log(`Selected website index ${currentIndex}: ${websiteList[currentIndex].url}`);
      return websiteList[currentIndex];
    }

    function loadWebsite(url) {
      const frame = document.getElementById('frame');
      const loading = document.getElementById('loading');
      loading.style.display = 'flex';
      loading.innerHTML = `Loading: ${url}`;
      log(`Loading website: ${url}`);
      frame.src = url;

      frame.onload = function() {
        log(`Website loaded successfully: ${url}`);
        loading.style.display = 'none';
      };

      frame.onerror = function(e) {
        log(`Error loading website: ${url}`, e);
        loading.innerHTML = `Error loading site. Refreshing...`;
        setTimeout(() => {
          window.location.reload();
        }, 30000); // wait 30 seconds then refresh
      };

      // safety fallback in case iframe fails silently
      setTimeout(() => {
        loading.style.display = 'none';
      }, 10000);
    }

    function scheduleNextRefresh() {
      if (refreshTimer) {
        clearTimeout(refreshTimer);
      }
      const refreshTime = getSecureRandomInt(MIN_REFRESH_TIME, MAX_REFRESH_TIME) * 1000;
      log(`Next refresh in ${refreshTime / 1000} seconds`);
      refreshTimer = setTimeout(() => {
        const website = selectRandomWebsite();
        if (website) {
          loadWebsite(website.url);
        }
        scheduleNextRefresh();
      }, refreshTime);
    }

    async function fetchConfig() {
      log('Fetching config from:', CONFIG_URL);
      try {
        const response = await fetch(CONFIG_URL, {
          mode: 'cors',
          cache: 'no-cache',
          credentials: 'omit',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!response.ok) throw new Error(`Fetch failed: ${response.status}`);

        const text = await response.text();
        log('Received response:', text.substring(0, 100) + '...');
        const data = JSON.parse(text);

        if (data && Array.isArray(data.urls)) {
          websiteList = data.urls.map(url => ({ url }));
          log(`Loaded ${websiteList.length} websites`);
        } else {
          throw new Error('Invalid config format');
        }
      } catch (err) {
        log('Config load failed:', err);
        const loading = document.getElementById('loading');
        loading.innerHTML = `Failed to load config. Refreshing in 30 seconds...`;
        setTimeout(() => {
          window.location.reload();
        }, 30000);
        return;
      }

      if (currentIndex === -1) {
        log('Starting website rotation');
        const website = selectRandomWebsite();
        if (website) {
          loadWebsite(website.url);
        }
        scheduleNextRefresh();
      }
    }

    window.addEventListener('load', function () {
      log('Page loaded, initializing...');
      fetchConfig();
    });

    // Refresh every hour to prevent memory issues
    setTimeout(() => {
      log('Refreshing page after 1 hour');
      window.location.reload();
    }, 3600000);
  </script>
</body>
</html>
