<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Wipe Transitions</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
            height: 100vh;
            width: 100vw;
        }
        
        #transition-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-color: white;
            transform-origin: top left;
            transform: scale(0, 0);
            transition: transform 4s ease;
        }
    </style>
</head>
<body>
    <div id="transition-overlay"></div>
    
    <script>
        const overlay = document.getElementById('transition-overlay');
        let isBlackBackground = true;
        
        // List of possible transition directions
        const directions = [
            'top',
            'bottom',
            'left',
            'right',
            'top-right',
            'top-left',
            'bottom-right',
            'bottom-left'
        ];
        
        // Function to apply a random wipe transition
        function applyRandomWipe() {
            // Get a random direction
            const direction = directions[Math.floor(Math.random() * directions.length)];
            
            // Configure the transition based on the direction
            switch(direction) {
                case 'top':
                    overlay.style.transformOrigin = 'top center';
                    overlay.style.transform = 'scale(1, 0)';
                    break;
                case 'bottom':
                    overlay.style.transformOrigin = 'bottom center';
                    overlay.style.transform = 'scale(1, 0)';
                    break;
                case 'left':
                    overlay.style.transformOrigin = 'center left';
                    overlay.style.transform = 'scale(0, 1)';
                    break;
                case 'right':
                    overlay.style.transformOrigin = 'center right';
                    overlay.style.transform = 'scale(0, 1)';
                    break;
                case 'top-right':
                    overlay.style.transformOrigin = 'top right';
                    overlay.style.transform = 'scale(0, 0)';
                    break;
                case 'top-left':
                    overlay.style.transformOrigin = 'top left';
                    overlay.style.transform = 'scale(0, 0)';
                    break;
                case 'bottom-right':
                    overlay.style.transformOrigin = 'bottom right';
                    overlay.style.transform = 'scale(0, 0)';
                    break;
                case 'bottom-left':
                    overlay.style.transformOrigin = 'bottom left';
                    overlay.style.transform = 'scale(0, 0)';
                    break;
            }
            
            // Set timeout for the next transition
            setTimeout(startWipeTransition, 5000);
        }
        
        // Function to start a wipe transition
        function startWipeTransition() {
            // Toggle background
            isBlackBackground = !isBlackBackground;
            
            // Set the overlay color opposite to the background
            overlay.style.backgroundColor = isBlackBackground ? 'white' : 'black';
            
            // Configure the body background color
            document.body.style.backgroundColor = isBlackBackground ? 'black' : 'white';
            
            // Reset the transform and transform-origin
            overlay.style.transition = 'none';
            overlay.style.transform = 'scale(1, 1)';
            
            // Force reflow
            void overlay.offsetWidth;
            
            // Enable transition again
            overlay.style.transition = 'transform 4s ease';
            
            // Apply the random wipe
            applyRandomWipe();
        }
        
        // Start the first transition after 5 seconds
        setTimeout(startWipeTransition, 5000);
    </script>
</body>
</html>
