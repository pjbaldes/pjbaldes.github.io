<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Millennial Doom Thoughts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Roboto&family=Merriweather&family=Open+Sans&family=Lora&family=Poppins&family=Crimson+Text&family=Source+Sans+Pro&family=Libre+Baskerville&family=Montserrat" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: white;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .thought-bubble {
      position: absolute;
      max-width: 420px;
      cursor: pointer;
      transition: all 0.3s ease;
      animation: fadeInFloat 6s ease-in-out;
      z-index: 1;
    }

    .thought-bubble:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    .bubble-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 22px;
      line-height: 1.4;
      text-align: center;
      padding: 21px;
      width: 90%;
      pointer-events: none;
      font-weight: 500;
    }

    .bubble-content.text-on-white {
      color: #111;
      text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    }

    .bubble-content.text-on-black {
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.5);
    }

    @keyframes fadeInFloat {
      0% {
        opacity: 0;
        transform: translateY(80px) scale(0.7);
      }
      15% {
        opacity: 1;
        transform: translateY(0px) scale(1);
      }
      75% {
        opacity: 1;
        transform: translateY(-30px) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translateY(-70px) scale(0.9);
      }
    }

    .svg-bubble {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 4px 15px rgba(0,0,0,0.2));
    }
  </style>
</head>
<body>
<script>
const doomThoughts = [
  "I'll never afford a house",
  "my degree is worthless",
  "will AI pay off student loans?",
  "The economy crashed again?",
  "retirement is a myth",
  "ChatGPT writes better than I do",
  "avocado toast bankrupted me",
  "Climate change will end everything anyway",
  "My parents bought houses for $30k",
  "The machines are learning too fast",
  "LinkedIn influencers haunt my dreams",
  "I'm 30 and live with roommates",
  "AI art is replacing real artists",
  "The housing market is broken forever",
  "My coding bootcamp was a scam",
  "Robots will be my retirement plan",
  "Gig economy killed job security",
  "The internet ruined everything",
  "Student debt follows me to the grave",
  "AI knows my search history",
  "Minimum wage, maximum debt",
  "The algorithm controls my mind",
  "I can't afford therapy for my anxiety about AI",
  "My data is worth more than my labor",
  "The singularity is next Tuesday",
  "Inflation ate my savings",
  "AI girlfriends are cheaper than dating",
  "The metaverse is just expensive depression",
  "My job will be automated by lunchtime",
  "Healthcare costs more than a house",
  "AI wrote my resignation letter",
  "The robots have better benefits",
  "My carbon footprint is already doomed",
  "TikTok knows me better than I know myself",
  "i dont want to talk about ai anymore",
  "I tip more than I save",
  "I can't tell if I'm burned out or obsolete",
  "My boss thinks emojis are work culture",
  "I own nothing and subscribe to everything",
  "I learned to code just in time for AI to do it better",
  "I missed the window for crypto and real estate",
  "Capitalism is my love language now",
  "My resume is optimized for robots",
  "I'm nostalgic for 2010s nihilism",
  "My fridge has WiFi but I can't afford eggs",
     "I'll never afford a house",
            "My degree is worthless now",
            "AI will take my job before I pay off student loans",
            "The economy crashed again?",
            "Retirement is a myth",
            "ChatGPT writes better than I do",
            "Avocado toast bankrupted me",
            "Climate change will end everything anyway",
            "My parents bought houses for $30k",
            "The machines are learning too fast",
            "LinkedIn influencers haunt my dreams",
            "I'm 30 and live with 3 roommates",
            "AI art is meh",
            "The housing market is broken ",
            "My coding bootcamp was a scam",
            "Robots will be take my retirement plan",
            "Gig economy killed job security",
            "The internet ruined everything",
            "Student debt follows me to the grave",
            "AI knows my search history",
            "Minimum wage, maximum debt",
            "The algorithm controls my mind",
            "I can't afford therapy for my anxiety about AI",
            "My data is worth more than my labor",
            "The singularity is next Tuesday",
            "Inflation ate my savings",
            "AI girlfriends are cheaper than dating",
            "The metaverse is just expensive depression",
            "My job will be automated by lunchtime",
            "Healthcare costs is killing me",
            "AI wrote my resignation letter",
            "The robots have better benefits",
            "My carbon footprint...",
            "TikTok knows me better than I know myself",
            "i dont want to talk about ai anymore"
];

const googleFonts = [
  'Playfair Display', 'Roboto', 'Merriweather', 'Open Sans',
  'Lora', 'Poppins', 'Crimson Text', 'Source Sans Pro',
  'Libre Baskerville', 'Montserrat'
];

const svgBubbles = [
  {
    svg: `<svg viewBox="0 0 300 200"><ellipse cx="150" cy="100" rx="140" ry="80" fill="white" stroke="#333" stroke-width="2"/><circle cx="80" cy="170" r="15" fill="white" stroke="#333" stroke-width="2"/><circle cx="50" cy="185" r="8" fill="white" stroke="#333" stroke-width="2"/></svg>`,
    textColor: 'black'
  },
  {
    svg: `<svg viewBox="0 0 280 160"><ellipse cx="140" cy="80" rx="130" ry="70" fill="black" stroke="white" stroke-width="2"/><ellipse cx="60" cy="140" rx="12" ry="8" fill="black" stroke="white" stroke-width="2"/><ellipse cx="35" cy="150" rx="6" ry="4" fill="black" stroke="white" stroke-width="2"/></svg>`,
    textColor: 'white'
  }
];

function createThoughtBubble() {
  const bubble = document.createElement('div');
  bubble.className = 'thought-bubble';

  const selectedBubble = svgBubbles[Math.floor(Math.random() * svgBubbles.length)];
  const svgContainer = document.createElement('div');
  svgContainer.innerHTML = selectedBubble.svg;
  svgContainer.className = 'svg-bubble';

  const textContent = document.createElement('div');
  textContent.className = `bubble-content text-on-${selectedBubble.textColor === 'white' ? 'black' : 'white'}`;
  const thought = doomThoughts[Math.floor(Math.random() * doomThoughts.length)];
  textContent.textContent = thought;
  textContent.style.fontFamily = `'${googleFonts[Math.floor(Math.random() * googleFonts.length)]}', serif`;
  textContent.style.fontWeight = Math.random() < 0.4 ? 'bold' : '500';
  textContent.style.fontStyle = Math.random() < 0.3 ? 'italic' : 'normal';

  bubble.appendChild(svgContainer);
  bubble.appendChild(textContent);

  const x = Math.random() * (window.innerWidth - 320);
  const y = Math.random() * (window.innerHeight - 200);
  bubble.style.left = x + 'px';
  bubble.style.top = y + 'px';
  bubble.style.width = '320px';
  bubble.style.height = '200px';

  document.body.appendChild(bubble);

  setTimeout(() => {
    bubble.remove();
  }, 6000);

  bubble.addEventListener('click', () => {
    bubble.style.animation = 'none';
    bubble.style.opacity = '0';
    bubble.style.transform = 'scale(0)';
    setTimeout(() => bubble.remove(), 200);
  });
}

setInterval(() => {
  if (Math.random() < 0.7) createThoughtBubble();
}, 1000 + Math.random() * 2000);

for (let i = 0; i < 3; i++) {
  setTimeout(createThoughtBubble, i * 500);
}
</script>
</body>
</html>
