<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Millennial Doom Thoughts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Roboto&family=Merriweather&family=Open+Sans&family=Lora&family=Poppins&family=Crimson+Text&family=Source+Sans+Pro&family=Libre+Baskerville&family=Montserrat" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .thought-bubble {
      position: absolute;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 1;
    }

    .thought-bubble:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    .bubble-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      line-height: 1.4;
      text-align: center;
      padding: 21px;
      width: 90%;
      pointer-events: none;
      font-weight: 500;
    }

    .bubble-content.text-on-white {
      color: #111;
      text-shadow: 0 2px 4px rgba(255,255,255,0.9), 0 0 8px rgba(255,255,255,0.7);
    }

    .bubble-content.text-on-black {
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.6);
    }

    @keyframes fadeInFloatUp {
      0% {
        opacity: 0;
        transform: translateY(80px) scale(0.7);
      }
      15% {
        opacity: 1;
        transform: translateY(0px) scale(1);
      }
      75% {
        opacity: 1;
        transform: translateY(-80px) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translateY(-150px) scale(0.9);
      }
    }

    @keyframes fadeInFloatDown {
      0% {
        opacity: 0;
        transform: translateY(-80px) scale(0.7);
      }
      15% {
        opacity: 1;
        transform: translateY(0px) scale(1);
      }
      75% {
        opacity: 1;
        transform: translateY(80px) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translateY(150px) scale(0.9);
      }
    }

    @keyframes fadeInFloatLeft {
      0% {
        opacity: 0;
        transform: translateX(80px) scale(0.7);
      }
      15% {
        opacity: 1;
        transform: translateX(0px) scale(1);
      }
      75% {
        opacity: 1;
        transform: translateX(-80px) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translateX(-150px) scale(0.9);
      }
    }

    @keyframes fadeInFloatRight {
      0% {
        opacity: 0;
        transform: translateX(-80px) scale(0.7);
      }
      15% {
        opacity: 1;
        transform: translateX(0px) scale(1);
      }
      75% {
        opacity: 1;
        transform: translateX(80px) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translateX(150px) scale(0.9);
      }
    }

    @keyframes fadeInFloatUpLeft {
      0% {
        opacity: 0;
        transform: translate(60px, 60px) scale(0.7);
      }
      15% {
        opacity: 1;
        transform: translate(0px, 0px) scale(1);
      }
      75% {
        opacity: 1;
        transform: translate(-60px, -60px) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translate(-120px, -120px) scale(0.9);
      }
    }

    @keyframes fadeInFloatUpRight {
      0% {
        opacity: 0;
        transform: translate(-60px, 60px) scale(0.7);
      }
      15% {
        opacity: 1;
        transform: translate(0px, 0px) scale(1);
      }
      75% {
        opacity: 1;
        transform: translate(60px, -60px) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translate(120px, -120px) scale(0.9);
      }
    }

    @keyframes fadeInFloatDownLeft {
      0% {
        opacity: 0;
        transform: translate(60px, -60px) scale(0.7);
      }
      15% {
        opacity: 1;
        transform: translate(0px, 0px) scale(1);
      }
      75% {
        opacity: 1;
        transform: translate(-60px, 60px) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translate(-120px, 120px) scale(0.9);
      }
    }

    @keyframes fadeInFloatDownRight {
      0% {
        opacity: 0;
        transform: translate(-60px, -60px) scale(0.7);
      }
      15% {
        opacity: 1;
        transform: translate(0px, 0px) scale(1);
      }
      75% {
        opacity: 1;
        transform: translate(60px, 60px) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translate(120px, 120px) scale(0.9);
      }
    }

    .svg-bubble {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 4px 15px rgba(0,0,0,0.2));
    }
  </style>
</head>
<body>
<script>
const doomThoughts = [
  "I cant afford a house",
  "my degree is worthless",
  "will AI pay off student loans?",
  "the economy crashed again",
  "retirement is a myth",
  "ChatGPT writes better than I do",
  "avocado toast bankrupted me",
  "climate change has happened",
  "my parents house cost $30k",
  "the machines are learning",
  "linkedIn influencers haunt my dreams",
  "I'm 30 and live with 3 roommates",
  "AI art is meh",
  "the housing market is not for me",
  "my coding bootcamp was a scam",
  "robots are coming",
  "i will uber AND doordash",
  "the internet ruined me",
  "student debt is my grave",
  "my search history persists",
  "minimum wage",
  "the algorithm is my mind",
  "I can't afford therapy",
  "robots will be treated better than me",
  "my data is my labor",
  "the singularity? what are we waiting for?",
  "inflation",
  "savings account? lol!",
  "AI girlfriends are cheaper",
  "the metaverse is expensive depression",
  "my job will be automated",
  "healthcare costs are killing me",
  "AI wrote my resignation letter",
  "the robots have better benefits",
  "my carbon footprints in the sand",
  "TikTok knows better",
  "i dont want to talk about ai anymore",
  "I tip more than I make",
  "I can't tell if I'm burned out or obsolete",
  "emojis are work culture",
  "I own nothing and subscribe to everything",
  "I learned to code. why?",
  "I missed the window for crypto and real estate",
  "capitalism is my love language now",
  "my resume is optimized for robots",
  "I'm nostalgic for covid",
  "my fridge has WiFi",
     "I'll never own a house",
           
        
            "i dont want to talk about ai anymore"
];

const googleFonts = [
  'Playfair Display', 'Roboto', 'Merriweather', 'Open Sans',
  'Lora', 'Poppins', 'Crimson Text', 'Source Sans Pro',
  'Libre Baskerville', 'Montserrat'
];

// Set random background color
const isBackgroundBlack = Math.random() < 0.5;
document.body.style.background = isBackgroundBlack ? '#000' : '#fff';

const svgBubbles = [
  {
    svg: `<svg viewBox="0 0 300 200"><ellipse cx="150" cy="100" rx="140" ry="80" fill="white" stroke="#333" stroke-width="3"/><circle cx="80" cy="170" r="15" fill="white" stroke="#333" stroke-width="3"/><circle cx="50" cy="185" r="8" fill="white" stroke="#333" stroke-width="3"/></svg>`,
    textColor: 'black'
  },
  {
    svg: `<svg viewBox="0 0 280 160"><ellipse cx="140" cy="80" rx="130" ry="70" fill="#222" stroke="#ddd" stroke-width="3"/><ellipse cx="60" cy="140" rx="12" ry="8" fill="#222" stroke="#ddd" stroke-width="3"/><ellipse cx="35" cy="150" rx="6" ry="4" fill="#222" stroke="#ddd" stroke-width="3"/></svg>`,
    textColor: 'white'
  },
  {
    svg: `<svg viewBox="0 0 290 180"><ellipse cx="145" cy="90" rx="135" ry="75" fill="#f8f8f8" stroke="#111" stroke-width="3"/><circle cx="75" cy="155" r="13" fill="#f8f8f8" stroke="#111" stroke-width="3"/><circle cx="48" cy="168" r="7" fill="#f8f8f8" stroke="#111" stroke-width="3"/></svg>`,
    textColor: 'black'
  },
  {
    svg: `<svg viewBox="0 0 285 175"><ellipse cx="142" cy="87" rx="132" ry="72" fill="#111" stroke="#eee" stroke-width="3"/><ellipse cx="72" cy="150" rx="11" ry="7" fill="#111" stroke="#eee" stroke-width="3"/><ellipse cx="46" cy="162" rx="5" ry="3" fill="#111" stroke="#eee" stroke-width="3"/></svg>`,
    textColor: 'white'
  }
];

function createThoughtBubble() {
  const bubble = document.createElement('div');
  bubble.className = 'thought-bubble';

  // Generate random scale factor (1.0 to 3.0 for up to 200% larger)
  const scaleFactor = 1 + Math.random() * 2; // 1.0 to 3.0
  
  // Random animation direction
  const animations = [
    'fadeInFloatUp', 'fadeInFloatDown', 'fadeInFloatLeft', 'fadeInFloatRight',
    'fadeInFloatUpLeft', 'fadeInFloatUpRight', 'fadeInFloatDownLeft', 'fadeInFloatDownRight'
  ];
  const selectedAnimation = animations[Math.floor(Math.random() * animations.length)];
  const animationDuration = 10 + Math.random() * 5; // 10-15 seconds for slower movement
  
  bubble.style.animation = `${selectedAnimation} ${animationDuration}s ease-in-out`;
  
  const selectedBubble = svgBubbles[Math.floor(Math.random() * svgBubbles.length)];
  const svgContainer = document.createElement('div');
  svgContainer.innerHTML = selectedBubble.svg;
  svgContainer.className = 'svg-bubble';

  const textContent = document.createElement('div');
  textContent.className = `bubble-content text-on-${selectedBubble.textColor === 'black' ? 'white' : 'black'}`;
  const thought = doomThoughts[Math.floor(Math.random() * doomThoughts.length)];
  textContent.textContent = thought;
  textContent.style.fontFamily = `'${googleFonts[Math.floor(Math.random() * googleFonts.length)]}', serif`;
  textContent.style.fontWeight = Math.random() < 0.4 ? 'bold' : '500';
  textContent.style.fontStyle = Math.random() < 0.3 ? 'italic' : 'normal';
  
  // Scale the font size based on the scale factor
  const baseFontSize = 22;
  textContent.style.fontSize = (baseFontSize * scaleFactor) + 'px';

  bubble.appendChild(svgContainer);
  bubble.appendChild(textContent);

  // Scale the bubble dimensions
  const baseWidth = 320;
  const baseHeight = 200;
  const scaledWidth = baseWidth * scaleFactor;
  const scaledHeight = baseHeight * scaleFactor;

  // Adjust positioning to account for larger sizes and animation direction
  const padding = 200; // Extra padding to account for animation movement
  const maxX = Math.max(0, window.innerWidth - scaledWidth + padding);
  const maxY = Math.max(0, window.innerHeight - scaledHeight + padding);
  const x = Math.random() * maxX - padding/2;
  const y = Math.random() * maxY - padding/2;
  
  bubble.style.left = x + 'px';
  bubble.style.top = y + 'px';
  bubble.style.width = scaledWidth + 'px';
  bubble.style.height = scaledHeight + 'px';

  document.body.appendChild(bubble);

  setTimeout(() => {
    bubble.remove();
  }, animationDuration * 1000);

  bubble.addEventListener('click', () => {
    bubble.style.animation = 'none';
    bubble.style.opacity = '0';
    bubble.style.transform = 'scale(0)';
    setTimeout(() => bubble.remove(), 200);
  });
}

setInterval(() => {
  if (Math.random() < 0.6) createThoughtBubble();
}, 2000 + Math.random() * 3000);

for (let i = 0; i < 3; i++) {
  setTimeout(createThoughtBubble, i * 500);
}
</script>
</body>
</html>
