<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Folding Color Panels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        class FoldingPanel3D {
            constructor() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                
                this.panel = null;
                this.isAnimating = false;
                
                this.colors = [
                    0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff, 0x44ffff,
                    0xff8844, 0x88ff44, 0x4488ff, 0xff4488, 0x88ff88, 0x8844ff,
                    0xffffff, 0x888888, 0x444444, 0xcccccc, 0x666666, 0x222222
                ];
                
                this.foreColor = this.getRandomColor();
                this.backColor = this.getRandomColor();
                
                this.init();
            }

            init() {
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(this.backColor);
                document.body.appendChild(this.renderer.domElement);

                // Position camera to see fullscreen rectangle
                this.camera.position.z = 5;

                // Create fullscreen rectangle
                const aspect = window.innerWidth / window.innerHeight;
                const viewHeight = 2 * Math.tan((75 * Math.PI / 180) / 2) * 5;
                const viewWidth = viewHeight * aspect;
                
                const geometry = new THREE.PlaneGeometry(viewWidth, viewHeight);
                const material = new THREE.MeshBasicMaterial({ 
                    color: this.foreColor,
                    side: THREE.DoubleSide 
                });
                this.panel = new THREE.Mesh(geometry, material);
                this.scene.add(this.panel);

                this.animate();
                setTimeout(() => this.startFolding(), 2000);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.renderer.render(this.scene, this.camera);
            }

            getRandomColor() {
                return this.colors[Math.floor(Math.random() * this.colors.length)];
            }

            async startFolding() {
                while (true) {
                    if (!this.isAnimating) {
                        await this.fold();
                    }
                    await this.wait(3000);
                }
            }

            async fold() {
                this.isAnimating = true;
                
                const edges = ['top', 'bottom', 'left', 'right'];
                const edge = edges[Math.floor(Math.random() * edges.length)];
                
                // Set new background color
                const newBackColor = this.getRandomColor();
                this.renderer.setClearColor(newBackColor);
                
                // Get panel dimensions
                const aspect = window.innerWidth / window.innerHeight;
                const viewHeight = 2 * Math.tan((75 * Math.PI / 180) / 2) * 5;
                const viewWidth = viewHeight * aspect;
                
                // Create pivot point at the edge
                const pivot = new THREE.Object3D();
                this.scene.add(pivot);
                
                // Position pivot at edge
                switch(edge) {
                    case 'top':
                        pivot.position.y = viewHeight / 2;
                        this.panel.position.y = -viewHeight / 2;
                        break;
                    case 'bottom':
                        pivot.position.y = -viewHeight / 2;
                        this.panel.position.y = viewHeight / 2;
                        break;
                    case 'left':
                        pivot.position.x = -viewWidth / 2;
                        this.panel.position.x = viewWidth / 2;
                        break;
                    case 'right':
                        pivot.position.x = viewWidth / 2;
                        this.panel.position.x = -viewWidth / 2;
                        break;
                }
                
                // Parent panel to pivot
                this.scene.remove(this.panel);
                pivot.add(this.panel);

                // Animate rotation
                const startTime = Date.now();
                const duration = 2000;
                let targetRotation = 127 * Math.PI / 180;
                
                // Left/right need more rotation
                if (edge === 'left' || edge === 'right') {
                    targetRotation = 140 * Math.PI / 180;
                }
                
                const animateStep = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const rotation = progress * targetRotation;
                    
                    switch(edge) {
                        case 'top':
                            pivot.rotation.x = rotation;
                            break;
                        case 'bottom':
                            pivot.rotation.x = -rotation;
                            break;
                        case 'left':
                            pivot.rotation.y = rotation;
                            break;
                        case 'right':
                            pivot.rotation.y = -rotation;
                            break;
                    }
                    
                    if (progress < 1) {
                        requestAnimationFrame(animateStep);
                    } else {
                        // Push back to fore, reset
                        this.foreColor = newBackColor;
                        this.backColor = this.getRandomColor();
                        
                        this.panel.material.color.setHex(this.foreColor);
                        
                        // Remove pivot and restore panel to scene
                        pivot.remove(this.panel);
                        this.scene.remove(pivot);
                        this.panel.position.set(0, 0, 0);
                        this.panel.rotation.set(0, 0, 0);
                        this.scene.add(this.panel);
                        
                        this.isAnimating = false;
                    }
                };
                
                animateStep();
            }

            wait(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new FoldingPanel3D();
        });

        window.addEventListener('resize', () => {
            location.reload();
        });
    </script>
</body>
</html>
