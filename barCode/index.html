<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stochastic Barcodes</title>
    <style>
        body { margin: 0; overflow: hidden; background: #ffffff; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height;
let shapes = [];
const MAX_SHAPES = 20;
let lastSpawnTime = 0;
const SPAWN_DELAY = 3000; // Wait 3 seconds between adding new shapes initially

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

window.addEventListener('resize', resize);
resize();

class BarcodeShape {
    constructor() {
        this.init();
    }

    init() {
        // Size: Min 50, Max 50% of screen
        this.w = Math.floor(Math.random() * (width *.75 - 50) + 50);
        this.h = Math.floor(Math.random() * (height *.75 - 50) + 50);
        
        const directions = ['up', 'down', 'left', 'right'];
        this.dir = directions[Math.floor(Math.random() * directions.length)];
        
        // Speed: 0.5 to 3 px per cycle (half of original max)
        this.speed = Math.random() * 1.5 + 0.5;
        this.barcodeOrientation = Math.random() > 0.5 ? 'h' : 'v';
        
        this.bars = [];
        let pos = 0;
        const limit = this.barcodeOrientation === 'v' ? this.w : this.h;
        
        while (pos < limit) {
            let barThickness = Math.random() * 1 + 0.5; 
            let gap = Math.random() * 3 + 1; 
            this.bars.push({pos, thickness: barThickness});
            pos += barThickness + gap;
        }

        switch(this.dir) {
            case 'right': this.x = -this.w; this.y = Math.random() * height; break;
            case 'left':  this.x = width;   this.y = Math.random() * height; break;
            case 'down':  this.x = Math.random() * width; this.y = -this.h; break;
            case 'up':    this.x = Math.random() * width; this.y = height;  break;
        }
    }

    update() {
        switch(this.dir) {
            case 'right': this.x += this.speed; break;
            case 'left':  this.x -= this.speed; break;
            case 'down':  this.y += this.speed; break;
            case 'up':    this.y -= this.speed; break;
        }

        // Return true if still on screen, false if it has left
        return !(this.x > width + 100 || this.x < -this.w - 100 || 
                 this.y > height + 100 || this.y < -this.h - 100);
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = '#000000'; 
        this.bars.forEach(bar => {
            if (this.barcodeOrientation === 'v') {
                ctx.fillRect(bar.pos, 0, bar.thickness, this.h);
            } else {
                ctx.fillRect(0, bar.pos, this.w, bar.thickness);
            }
        });
        ctx.restore();
    }
}

// Start with just one barcode
shapes.push(new BarcodeShape());

function animate(currentTime) {
    ctx.clearRect(0, 0, width, height);

    // 1. Slowly add shapes until we hit MAX_SHAPES
    if (shapes.length < MAX_SHAPES && currentTime - lastSpawnTime > SPAWN_DELAY) {
        shapes.push(new BarcodeShape());
        lastSpawnTime = currentTime;
    }

    // 2. Update and Filter (Remove shapes that left the screen)
    for (let i = shapes.length - 1; i >= 0; i--) {
        const isOnScreen = shapes[i].update();
        
        if (!isOnScreen) {
            // Remove the shape
            shapes.splice(i, 1);
            
            // 3. Randomly decide to respawn a new one immediately (50% chance)
            // This ensures the screen density fluctuates naturally.
            if (Math.random() > 0.5) {
                shapes.push(new BarcodeShape());
            }
        } else {
            shapes[i].draw();
        }
    }

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
