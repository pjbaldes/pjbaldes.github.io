<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid of Walking Triangles</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        .grid-container {
            display: grid;
            width: 100vw;
            height: 100vh;
            gap: 0;
        }
        
        .triangle-container {
            position: relative;
            overflow: hidden;
        }
        
        .triangle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .controls {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
            transition: opacity 1s ease-out;
        }
        
        .controls.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        
        .controls.fade-in {
            opacity: 1;
            pointer-events: auto;
        }
        
        button {
            background: #333;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin: 2px;
        }
        
        button:hover {
            background: #555;
        }
        
        input[type="range"] {
            width: 80px;
        }
        
        input[type="number"] {
            width: 40px;
            padding: 2px;
        }
    </style>
</head>
<body>
    <div id="gridContainer" class="grid-container"></div>
    
    <div class="controls">
        <div>
            <button onclick="toggleAllAnimations()">Pause/Resume All</button>
            <button onclick="newColorsAll()">New Colors</button>
        </div>
        <div>
            Rows: <input type="range" id="rowsSlider" min="1" max="50" value="3" onchange="updateGridFromSliders()">
            <span id="rowsValue">3</span>
        </div>
        <div>
            Cols: <input type="range" id="colsSlider" min="1" max="50" value="4" onchange="updateGridFromSliders()">
            <span id="colsValue">4</span>
        </div>
        <div>Speed: <input type="range" id="speedSlider" min="1" max="10" value="2" onchange="updateAllSpeeds()"></div>
        <div>Offset: <input type="checkbox" id="offsetCheckbox" onchange="updateGrid()"> Random Start (disabled)</div>
    </div>

    <script>
        class WalkingTriangle {
            constructor(container, width, height, backgroundColor, triangleColor, onCycleComplete) {
                this.container = container;
                this.width = width;
                this.height = height;
                this.backgroundColor = backgroundColor;
                this.triangleColor = triangleColor;
                this.onCycleComplete = onCycleComplete;
                this.cycleCompleted = false;
                
                this.corners = [
                    [0, 0],
                    [0, height],
                    [width, height]
                ];
                
                this.animationRunning = true;
                this.step = 2;
                this.animationId = null;
                
                this.movements = [
                    { corner: 0, target: [width, 0], axis: 'x', direction: 1 },
                    { corner: 1, target: [0, 0], axis: 'y', direction: -1 },
                    { corner: 2, target: [0, height], axis: 'x', direction: -1 },
                    { corner: 0, target: [width, height], axis: 'y', direction: 1 },
                    { corner: 1, target: [width, 0], axis: 'x', direction: 1 },
                    { corner: 2, target: [0, 0], axis: 'y', direction: -1 }
                ];
                
                this.currentMovement = 0;
                this.init();
            }
            
            init() {
                this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                this.svg.setAttribute('class', 'triangle');
                this.svg.setAttribute('viewBox', `0 0 ${this.width} ${this.height}`);
                
                this.triangle = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                this.triangle.setAttribute('fill', this.triangleColor);
                
                this.svg.appendChild(this.triangle);
                this.container.appendChild(this.svg);
                
                this.updateTriangle();
                this.animate();
            }
            
            updateTriangle() {
                const points = this.corners.map(corner => corner.join(',')).join(' ');
                this.triangle.setAttribute('points', points);
            }
            
            animate() {
                if (!this.animationRunning) return;
                
                const movement = this.movements[this.currentMovement];
                const corner = this.corners[movement.corner];
                const target = movement.target;
                const axis = movement.axis === 'x' ? 0 : 1;
                
                if (movement.direction > 0) {
                    corner[axis] = Math.min(corner[axis] + this.step, target[axis]);
                } else {
                    corner[axis] = Math.max(corner[axis] - this.step, target[axis]);
                }
                
                if (corner[axis] === target[axis]) {
                    this.currentMovement = (this.currentMovement + 1) % this.movements.length;
                    
                    if (this.currentMovement === 0 && !this.cycleCompleted) {
                        this.cycleCompleted = true;
                        if (this.onCycleComplete) {
                            this.onCycleComplete();
                        }
                    }
                }
                
                this.updateTriangle();
                this.animationId = requestAnimationFrame(() => this.animate());
            }
            
            toggleAnimation() {
                this.animationRunning = !this.animationRunning;
                if (this.animationRunning) {
                    this.animate();
                } else {
                    cancelAnimationFrame(this.animationId);
                }
            }
            
            setSpeed(speed) {
                this.step = speed;
            }
            
            setRandomOffset() {
                return;
            }
        }
        
        let triangles = [];
        let globalBackgroundColor = '';
        let globalTriangleColor = '';
        let cycleCompleted = false;
        let fadeTimeout;
        let isInterfaceFaded = false;
        let cyclesSinceLastMouse = 0;
        let lastMouseTime = Date.now();
        
        function generateGlobalColors() {
            const r1 = Math.floor(Math.random() * 256);
            const g1 = Math.floor(Math.random() * 256);
            const b1 = Math.floor(Math.random() * 256);
            globalBackgroundColor = `rgb(${r1}, ${g1}, ${b1})`;
            
            const r2 = Math.floor(Math.random() * 256);
            const g2 = Math.floor(Math.random() * 256);
            const b2 = Math.floor(Math.random() * 256);
            globalTriangleColor = `rgb(${r2}, ${g2}, ${b2})`;
        }
        
        function onTriangleCycleComplete() {
            if (!cycleCompleted) {
                cycleCompleted = true;
                
                // Check if it's been long enough since last mouse activity
                const timeSinceLastMouse = Date.now() - lastMouseTime;
                const fiveSecondsInMs = 5000;
                
                if (timeSinceLastMouse > fiveSecondsInMs) {
                    cyclesSinceLastMouse++;
                } else {
                    cyclesSinceLastMouse = 0; // Reset if mouse was active recently
                }
                
                // After 10 cycles with no mouse action, reroll everything
                if (cyclesSinceLastMouse >= 10) {
                    cyclesSinceLastMouse = 0;
                    setTimeout(() => {
                        createRandomGrid();
                    }, 100);
                } else {
                    // Just continue with current settings
                    setTimeout(() => {
                        cycleCompleted = false;
                        // Reset all triangles to start new cycle
                        triangles.forEach(triangle => {
                            triangle.cycleCompleted = false;
                        });
                    }, 100);
                }
            }
        }
        
        function createRandomGrid() {
            const rows = Math.floor(Math.random() * 50) + 1;
            const cols = Math.floor(Math.random() * 50) + 1;
            
            document.getElementById('rowsSlider').value = rows;
            document.getElementById('colsSlider').value = cols;
            document.getElementById('rowsValue').textContent = rows;
            document.getElementById('colsValue').textContent = cols;
            
            cycleCompleted = false;
            createGrid();
        }
        
        function fadeOutControls() {
            clearTimeout(fadeTimeout);
            fadeTimeout = setTimeout(() => {
                const controls = document.querySelector('.controls');
                controls.classList.add('fade-out');
                controls.classList.remove('fade-in');
                isInterfaceFaded = true;
            }, 5000);
        }
        
        function wakeUpInterface() {
            lastMouseTime = Date.now(); // Update last mouse time
            cyclesSinceLastMouse = 0; // Reset cycle counter on mouse activity
            
            if (isInterfaceFaded) {
                const controls = document.querySelector('.controls');
                controls.classList.remove('fade-out');
                controls.classList.add('fade-in');
                isInterfaceFaded = false;
            }
            fadeOutControls();
        }
        
        function createGrid() {
            const gridContainer = document.getElementById('gridContainer');
            const rows = parseInt(document.getElementById('rowsSlider').value);
            const cols = parseInt(document.getElementById('colsSlider').value);
            const speed = parseInt(document.getElementById('speedSlider').value);
            
            triangles.forEach(triangle => {
                if (triangle.animationId) {
                    cancelAnimationFrame(triangle.animationId);
                }
            });
            triangles = [];
            gridContainer.innerHTML = '';
            
            generateGlobalColors();
            
            gridContainer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
            gridContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            
            const cellWidth = Math.floor(window.innerWidth / cols);
            const cellHeight = Math.floor(window.innerHeight / rows);
            
            for (let i = 0; i < rows * cols; i++) {
                const container = document.createElement('div');
                container.className = 'triangle-container';
                container.style.backgroundColor = globalBackgroundColor;
                
                gridContainer.appendChild(container);
                
                const triangle = new WalkingTriangle(container, cellWidth, cellHeight, globalBackgroundColor, globalTriangleColor, onTriangleCycleComplete);
                triangle.setSpeed(speed);
                
                triangles.push(triangle);
            }
        }
        
        function updateGridFromSliders() {
            document.getElementById('rowsValue').textContent = document.getElementById('rowsSlider').value;
            document.getElementById('colsValue').textContent = document.getElementById('colsSlider').value;
            createGrid();
        }
        
        function updateGrid() {
            createGrid();
        }
        
        function newColorsAll() {
            generateGlobalColors();
            triangles.forEach(triangle => {
                triangle.container.style.backgroundColor = globalBackgroundColor;
                triangle.triangle.setAttribute('fill', globalTriangleColor);
            });
        }
        
        function toggleAllAnimations() {
            triangles.forEach(triangle => triangle.toggleAnimation());
        }
        
        function updateAllSpeeds() {
            const speed = parseInt(document.getElementById('speedSlider').value);
            triangles.forEach(triangle => triangle.setSpeed(speed));
        }
        
        window.addEventListener('resize', () => {
            setTimeout(createGrid, 100);
        });
        
        document.addEventListener('mousemove', wakeUpInterface);
        document.addEventListener('mousedown', wakeUpInterface);
        document.addEventListener('keydown', wakeUpInterface);
        
        createGrid();
        fadeOutControls();
    </script>
</body>
</html>
