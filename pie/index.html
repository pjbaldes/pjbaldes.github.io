        }
        canvas {
            display: block;
        }
    </style>

            "blathered", "blithe", "boggled", "bombastic", "bourgeois", "brackish", "thorny", "brandished", "boastful", "glowing",
            "breached", "brief", "bridled", "green", "bronzed", "bucolic", "stampeding", "protective", "buoyant", "burlesque",
            "cadaverous", "rhythmic", "athletic", "callous", "slanderous", "friendly", "bright", "nominated", "shaded", "cantankerous",
            "capacious", "capillary", "capitulated", "capricious", "captivated", "traveling", "cardinal", "spinning", "mapped", "cascading",

            "dissolved", "dissonant", "distended", "distilled", "distorted", "distraught", "diverged", "divined", "divulged", "docile",
            "stagnant", "dovetailed", "draconian", "dubious", "dulcet", "duplicitous", "endured", "dynamic", "dystopian", "ebullient",
            "eccentric", "ranked", "eclectic", "eclipsed", "ecstatic", "constructed", "effaced", "effervescent", "brazen", "effusive",
            "egalitarian", "egregious", "elaborated", "elated", "eligible", "elliptical", "eloquent", "elucidated", "elusive", "emanated",
            "embellished", "embezzled", "emblematic", "embossed", "embraced", "embryonic", "eminent", "empathetic", "empirical", "emulated",
            "praised", "endemic", "endured", "enervated", "enfeebled", "engendered", "enigmatic", "hostile", "bored", "performed",
            "enthralled", "enticed", "entrenched", "enumerated", "enveloped", "envisaged", "ephemeral", "epicurean", "enlightened", "epitomized",
            "balanced", "equivocated", "eradicated", "erratic", "erudite", "escalated", "esoteric", "spied", "ethereal", "ethical",
            "euphonious", "euphoric", "evacuated", "evanescent", "evasive", "evocative", "exacerbated", "exact", "exasperated", "excavated",
            "exemplary", "exhilarated", "exhorted", "existential", "exonerated", "expansive", "expedient", "expert", "expiated", "explicit",
            "extolled", "extravagant", "exuberant", "facade-like", "facetious", "facilitated", "copied", "factitious", "fallow", "fastidious",
            "fatalistic", "fatuous", "wild", "fecund", "felicitous", "ferocious", "fervent", "fickle", "trusted", "delicate",
            "finessed", "celestial", "flagrant", "flamboyant", "fledgling", "flippant", "florid", "floating", "flourished", "flummoxed",
            "flawed", "foreshadowed", "forged", "formidable", "fortified", "fortuitous", "fractious", "fragile", "frantic", "fraternized",
            "fraudulent", "frenetic", "painted", "fretful", "frivolous", "frugal", "fulminated", "fulsome", "furloughed", "furtive"
        ];

        // Initialize the canvas
        const canvas = document.getElementById('pieCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas to full window size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawCharts();
        }

        // Handle resizing
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Generate a random color
        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 70%, 60%)`;
        }

        // Generate a random background color
        function getRandomBackgroundColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 30%, 95%)`; // Light, subtle background
        }

        // Function to darken a color for text
        function darkenColor(hslColor) {
            // Extract HSL values
            const match = hslColor.match(/hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/);
            if (match) {
                const h = match[1];
                const s = match[2];
                const l = Math.max(25, parseInt(match[3]) - 30); // Darken by 30%, minimum 25%
                return `hsl(${h}, ${s}%, ${l}%)`;
            }
            return 'black';
        }

        // Draw a single pie chart at specified position and size
        function drawPieChart(centerX, centerY, radius, offsetX = 0, offsetY = 0) {
            // Generate number of sections (2-8) - updated range
            const sectionCount = Math.floor(Math.random() * 7) + 2;
            
            // Create array to hold section values
            let sections = [];
            let total = 0;
            
            // Generate varied section sizes
            for (let i = 0; i < sectionCount; i++) {
                let value;
                // Create three tiers of section sizes
                if (i % 3 === 0) {
                    value = 30 + Math.random() * 30; // Large: 30-60
                } else if (i % 3 === 1) {
                    value = 15 + Math.random() * 15; // Medium: 15-30
                } else {
                    value = 5 + Math.random() * 10; // Small: 5-15
                }
                sections.push(value);
                total += value;
            }
            
            // Normalize to make sum = 1
            sections = sections.map(section => section / total);
            
            // Select random words (without duplicates)
            const selectedWords = [];
            const usedIndices = new Set();
            
            for (let i = 0; i < sectionCount; i++) {
                let index;
                do {
                    index = Math.floor(Math.random() * words.length);
                } while (usedIndices.has(index));
                
                usedIndices.add(index);
                selectedWords.push(words[index]);
            }
            
            // Generate colors
            const colors = Array(sectionCount).fill().map(() => getRandomColor());
            
            // Draw pie sections
            let startAngle = 0;
            
            for (let i = 0; i < sectionCount; i++) {
                const endAngle = startAngle + (Math.PI * 2 * sections[i]);
                const midAngle = startAngle + (endAngle - startAngle) / 2;
                
                // Draw section
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                
                ctx.fillStyle = colors[i];
                ctx.fill();
                
                // Calculate label position - further from center and within screen bounds
                const labelStartRadius = radius * 1.05; // Start line just outside the pie
                const labelEndRadius = radius * 1.8; // End line position
                
                // Calculate angles for label positioning
                let labelAngle = midAngle;
                
                // Calculate initial label position
                let labelEndX = centerX + Math.cos(labelAngle) * labelEndRadius;
                let labelEndY = centerY + Math.sin(labelAngle) * labelEndRadius;
                
                // Check if label would go off screen and adjust
                const margin = 80;
                if (labelEndX < margin) labelEndX = margin;
                if (labelEndX > canvas.width - margin) labelEndX = canvas.width - margin;
                if (labelEndY < margin) labelEndY = margin;
                if (labelEndY > canvas.height - margin) labelEndY = canvas.height - margin;
                
                // Calculate text dimensions for positioning - increased font size
                const fontSize = Math.max(14, Math.min(canvas.width, canvas.height) * 0.025); // Increased from 0.02 to 0.025
                ctx.font = `${fontSize}px Arial`;
                const textWidth = ctx.measureText(selectedWords[i]).width;
                const textHeight = fontSize;
                
                // Calculate line end point that avoids overlapping with text
                let lineEndX, lineEndY;
                
                if (labelEndX < centerX) {
                    lineEndX = labelEndX + textWidth / 2 + 5;
                } else {
                    lineEndX = labelEndX - textWidth / 2 - 5;
                }
                
                if (labelEndY < centerY) {
                    lineEndY = labelEndY + textHeight / 2 + 2;
                } else {
                    lineEndY = labelEndY - textHeight / 2 - 2;
                }
                
                // Draw label line from pie edge to text edge
                const lineStartX = centerX + Math.cos(midAngle) * labelStartRadius;
                const lineStartY = centerY + Math.sin(midAngle) * labelStartRadius;
                
                ctx.beginPath();
                ctx.moveTo(lineStartX, lineStartY);
                ctx.lineTo(lineEndX, lineEndY);
                ctx.strokeStyle = darkenColor(colors[i]);
                ctx.lineWidth = 1.5;
                ctx.stroke();
                
                // Draw label text
                ctx.fillStyle = darkenColor(colors[i]);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(selectedWords[i], labelEndX, labelEndY);
                
                // Update start angle for next section
                startAngle = endAngle;
            }
            
            // Draw outline
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Main drawing function that handles multiple charts based on aspect ratio
        function drawCharts() {
            // Set random background color
            document.body.style.backgroundColor = getRandomBackgroundColor();
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const aspectRatio = canvas.width / canvas.height;
            const minDimension = Math.min(canvas.width, canvas.height);
            
            // Determine layout based on aspect ratio
            if (aspectRatio > 1.8) {
                // Very wide window - 3 charts horizontally
                const chartRadius = minDimension * 0.18;
                const spacing = canvas.width / 4;
                
                drawPieChart(spacing, canvas.height / 2, chartRadius);
                drawPieChart(spacing * 2, canvas.height / 2, chartRadius);
                drawPieChart(spacing * 3, canvas.height / 2, chartRadius);
                
            } else if (aspectRatio > 1.3) {
                // Wide window - 2 charts horizontally
                const chartRadius = minDimension * 0.22;
                const spacing = canvas.width / 3;
                
                drawPieChart(spacing, canvas.height / 2, chartRadius);
                drawPieChart(spacing * 2, canvas.height / 2, chartRadius);
                
            } else if (aspectRatio < 0.6) {
                // Very tall window - 3 charts vertically
                const chartRadius = minDimension * 0.18;
                const spacing = canvas.height / 4;
                
                drawPieChart(canvas.width / 2, spacing, chartRadius);
                drawPieChart(canvas.width / 2, spacing * 2, chartRadius);
                drawPieChart(canvas.width / 2, spacing * 3, chartRadius);
                
            } else if (aspectRatio < 0.8) {
                // Tall window - 2 charts vertically
                const chartRadius = minDimension * 0.22;
                const spacing = canvas.height / 3;
                
                drawPieChart(canvas.width / 2, spacing, chartRadius);
                drawPieChart(canvas.width / 2, spacing * 2, chartRadius);
                
            } else {
                // Square-ish window - single chart
                const chartRadius = minDimension * 0.25;
                drawPieChart(canvas.width / 2, canvas.height / 2, chartRadius);
            }
        }

        // Click to regenerate
        canvas.addEventListener('click', drawCharts);
    </script>
</body>
