            "doldrums", "dovetail", "draconian", "dubious", "dulcet", "duplicity", "durable", "dynamic", "dystopian", "ebullient",
            "eccentric", "echelon", "eclectic", "eclipse", "ecstasy", "edifice", "efface", "effervescent", "effrontery", "effusive",
            "egalitarian", "egregious", "elaborate", "elation", "eligible", "elliptical", "elocution", "elucidate", "elusive", "emanate",
            "embellish", "embezzle", "emblematic", "emboss", "embrace", "embryonic", "eminent", "empathy", "empirical", "emulate",

            "equanimity", "equivocate", "eradicate", "erratic", "erudite", "escalate", "esoteric", "espionage", "ethereal", "ethical",
            "euphonious", "euphoria", "evacuate", "evanescent", "evasive", "evocative", "exacerbate", "exactitude", "exasperate", "excavate",
            "exemplary", "exhilarate", "exhort", "existential", "exonerate", "expanse", "expedient", "expertise", "expiate", "explicit",
            "extol", "extravagant", "exuberant", "facade", "facetious", "facilitate", "facsimile", "factitious", "fallow", "fastidious",
            "fatalistic", "fatuous", "fauna", "fecund", "felicitous", "ferocious", "fervent", "fickle", "fiduciary", "filigree",
            "finesse", "firmament", "flagrant", "flamboyant", "fledgling", "flippant", "florid", "flotsam", "flourish", "flummox",
            "foible", "foreshadow", "forge", "formidable", "fortitude", "fortuitous", "fractious", "fragile", "frantic", "fraternize",
            "fraudulent", "frenetic", "fresco", "fretful", "frivolous", "frugal", "fulminate", "fulsome", "furlough", "furtive"
        ];

        // Initialize the canvas
        const canvas = document.getElementById('pieCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas to full window size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawPieChart();
        }

        // Handle resizing
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Generate a random color
        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 70%, 60%)`;
        }

        // Draw the pie chart
        function drawPieChart() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Set pie chart dimensions
            const centerX = canvas.width / 1.5;
            const centerY = canvas.height / 1.5;
            const radius = Math.min(canvas.width, canvas.height) * 0.325; // 65% of smallest dimension

            // Generate number of sections (3-16)
            const sectionCount = Math.floor(Math.random() * 14) + 3;
            
            // Create array to hold section values
            let sections = [];
            let total = 0;
            
            // Generate varied section sizes
            for (let i = 0; i < sectionCount; i++) {
                let value;
                // Create three tiers of section sizes
                if (i % 3 === 0) {
                    value = 30 + Math.random() * 30; // Large: 30-60
                } else if (i % 3 === 1) {
                    value = 15 + Math.random() * 15; // Medium: 15-30
                } else {
                    value = 5 + Math.random() * 10; // Small: 5-15
                }
                sections.push(value);
                total += value;
            }
            
            // Normalize to make sum = 1
            sections = sections.map(section => section / total);
            
            // Select random words (without duplicates)
            const selectedWords = [];
            const usedIndices = new Set();
            
            for (let i = 0; i < sectionCount; i++) {
                let index;
                do {
                    index = Math.floor(Math.random() * words.length);
                } while (usedIndices.has(index));
                
                usedIndices.add(index);
                selectedWords.push(words[index]);
            }
            
            // Generate colors
            const colors = Array(sectionCount).fill().map(() => getRandomColor());
            
            // Draw pie sections
            let startAngle = 0;
            
            for (let i = 0; i < sectionCount; i++) {
                const endAngle = startAngle + (Math.PI * 2 * sections[i]);
                const midAngle = startAngle + (endAngle - startAngle) / 2;
                
                // Draw section
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                
                ctx.fillStyle = colors[i];
                ctx.fill();
                
                // Draw label line
                const labelRadius = radius * 1.4;
                const labelX = centerX + Math.cos(midAngle) * labelRadius;
                const labelY = centerY + Math.sin(midAngle) * labelRadius;
                
                ctx.beginPath();
                ctx.moveTo(centerX + Math.cos(midAngle) * radius, centerY + Math.sin(midAngle) * radius);
                ctx.lineTo(labelX, labelY);
                ctx.strokeStyle = 'rgba(120, 120, 120, 0.6)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
                
                // Draw label text
                ctx.font = '40px Arial';
                ctx.fillStyle = 'black';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(selectedWords[i], labelX, labelY);
                
                // Update start angle for next section
                startAngle = endAngle;
            }
            
            // Draw outline
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Click to regenerate
        canvas.addEventListener('click', drawPieChart);
    </script>
</body>
</html>
