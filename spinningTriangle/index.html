<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Remove scroll bars */
        }
    </style>
</head>
<body>
    <script>
        let sz;
        let triangles = [];
        let cols, rows;
        let colorShades = [];
        let bgColor;
        let lastRotationTime = 0;
        let rotationInterval = 1000; // 1 second
        let animatingTriangle = null;
        let animationStartTime = 0;
        let animationDuration = 1000; // 1 second animation
        let refreshTime;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            
            // Random grid size between 100 and 300
            sz = random(100, 300);
            
            // Set random refresh time between 30-90 seconds
            refreshTime = random(30000, 90000); // Convert to milliseconds
            setTimeout(() => {
                location.reload();
            }, refreshTime);
            
            // Pick random base RGB color
            let baseR = random(0, 255);
            let baseG = random(0, 255);
            let baseB = random(0, 255);
            
            // Create 4 shades of the base color (lightest to darkest)
            colorShades = [
                color(
                    Math.min(255, baseR + 60),
                    Math.min(255, baseG + 60), 
                    Math.min(255, baseB + 60)
                ), // Lightest
                color(baseR, baseG, baseB), // Base color
                color(
                    Math.max(0, baseR - 40),
                    Math.max(0, baseG - 40),
                    Math.max(0, baseB - 40)
                ), // Darker
                color(
                    Math.max(0, baseR - 80),
                    Math.max(0, baseG - 80),
                    Math.max(0, baseB - 80)
                )  // Darkest
            ];
            
            // Pick random background color
            bgColor = color(random(0, 255), random(0, 255), random(0, 255));
            
            // Calculate grid dimensions (include bleeding off edges)
            cols = Math.ceil(windowWidth / sz) + 1;
            rows = Math.ceil(windowHeight / sz) + 1;
            
            // Create triangle objects - 3 triangles per grid position
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    let x = col * sz;
                    let y = row * sz;
                    
                    // Create three triangles at this position
                    for (let i = 0; i < 3; i++) {
                        let triangle = {
                            x: x,
                            y: y,
                            currentRotation: random([0, 90, 180, 270]),
                            targetRotation: 0,
                            color: random(colorShades),
                            isAnimating: false
                        };
                        triangle.targetRotation = triangle.currentRotation;
                        triangles.push(triangle);
                    }
                }
            }
            
            lastRotationTime = millis();
        }

        function draw() {
            background(bgColor);
            
            // Check if it's time to rotate a new triangle (only if no triangle is currently animating)
            if (animatingTriangle === null && millis() - lastRotationTime > rotationInterval) {
                startNewRotation();
                lastRotationTime = millis();
            }
            
            // Update and draw triangles
            for (let triangle of triangles) {
                drawTriangle(triangle);
            }
        }

        function getTopTrianglesOnly() {
            // Group triangles by position
            let positionGroups = {};
            
            for (let i = 0; i < triangles.length; i++) {
                let triangle = triangles[i];
                let posKey = `${triangle.x},${triangle.y}`;
                
                if (!positionGroups[posKey]) {
                    positionGroups[posKey] = [];
                }
                positionGroups[posKey].push({triangle: triangle, index: i});
            }
            
            // Get the topmost (last) triangle from each position
            let topTriangles = [];
            for (let posKey in positionGroups) {
                let group = positionGroups[posKey];
                // The last triangle in the group is the topmost (drawn last)
                let topTriangle = group[group.length - 1];
                topTriangles.push(topTriangle);
            }
            
            return topTriangles;
        }

        function moveTriangleToTop(triangleIndex) {
            // Find all triangles at the same position
            let targetTriangle = triangles[triangleIndex];
            let samePositionIndices = [];
            
            for (let i = 0; i < triangles.length; i++) {
                if (triangles[i].x === targetTriangle.x && triangles[i].y === targetTriangle.y) {
                    samePositionIndices.push(i);
                }
            }
            
            // Remove the target triangle and add it back at the end of its position group
            let removedTriangle = triangles.splice(triangleIndex, 1)[0];
            
            // Find where to insert it (after the last triangle of the same position)
            let maxIndex = Math.max(...samePositionIndices.filter(i => i !== triangleIndex));
            if (maxIndex >= triangleIndex) {
                maxIndex--; // Adjust for the removed element
            }
            
            triangles.splice(maxIndex + 1, 0, removedTriangle);
            
            // Update the animatingTriangle reference
            animatingTriangle = removedTriangle;
        }

        function startNewRotation() {
            // Get only the topmost triangles (visible ones)
            let topTriangles = getTopTrianglesOnly();
            
            if (topTriangles.length === 0) return;
            
            // Pick a random triangle from the visible ones
            let randomTopTriangle = random(topTriangles);
            let triangleIndex = randomTopTriangle.index;
            let selectedTriangle = randomTopTriangle.triangle;
            
            // Randomly choose rotation direction (90 or -90 degrees)
            let rotationDirection = random([-90, 90]);
            
            // Set up animation
            selectedTriangle.targetRotation += rotationDirection;
            selectedTriangle.isAnimating = true;
            animatingTriangle = selectedTriangle;
            animationStartTime = millis();
            
            // Move this triangle to the top of its position group
            moveTriangleToTop(triangleIndex);
        }

        function drawTriangle(triangle) {
            push();
            
            // Calculate current rotation for animation
            let currentRotation = triangle.currentRotation;
            if (triangle.isAnimating) {
                let elapsed = millis() - animationStartTime;
                let progress = Math.min(elapsed / animationDuration, 1.0);
                
                // Smooth easing
                progress = easeInOutCubic(progress);
                
                currentRotation = lerp(triangle.currentRotation, triangle.targetRotation, progress);
                
                // Check if animation is complete
                if (progress >= 1.0) {
                    triangle.currentRotation = triangle.targetRotation;
                    triangle.isAnimating = false;
                    animatingTriangle = null;
                }
            }
            
            // Set up transformation matrix - rotate around the x,y point (top vertex)
            translate(triangle.x, triangle.y);
            rotate(radians(currentRotation));
            
            // Set fill color with no stroke
            fill(triangle.color);
            noStroke();
            
            // Draw triangle with (x,y) as the top vertex
            beginShape();
            vertex(0, 0);              // Top point (x,y)
            vertex(sz/2, sz/2);        // Bottom right (x+sz/2, y+sz/2)
            vertex(-sz/2, sz/2);       // Bottom left (x-sz/2, y+sz/2)
            endShape(CLOSE);
            
            pop();
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            
            // Recalculate grid and recreate triangles (include bleeding off edges)
            cols = Math.ceil(windowWidth / sz) + 1;
            rows = Math.ceil(windowHeight / sz) + 1;
            
            triangles = [];
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    let x = col * sz;
                    let y = row * sz;
                    
                    // Create three triangles at this position
                    for (let i = 0; i < 3; i++) {
                        let triangle = {
                            x: x,
                            y: y,
                            currentRotation: random([0, 90, 180, 270]),
                            targetRotation: 0,
                            color: random(colorShades),
                            isAnimating: false
                        };
                        triangle.targetRotation = triangle.currentRotation;
                        triangles.push(triangle);
                    }
                }
            }
        }
    </script>
</body>
</html>
