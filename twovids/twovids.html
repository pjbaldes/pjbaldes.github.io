<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Video Compositor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        .video-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-layer.top {
            z-index: 2;
        }
        
        .video-layer.bottom {
            z-index: 1;
        }
        

        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Loading videos...</div>
    
    <div class="video-container" id="videoContainer" style="display: none;">
        <video class="video-layer bottom" id="video1" autoplay muted loop playsinline></video>
        <video class="video-layer top" id="video2" autoplay muted loop playsinline></video>
    </div>

    <script>
        let videoList = [];
        
        const blendModes = [
            'normal', 'multiply', 'screen', 'overlay', 'darken', 'lighten',
            'color-dodge', 'color-burn', 'hard-light', 'soft-light',
            'difference', 'exclusion', 'hue', 'saturation', 'color', 'luminosity'
        ];
        
        async function fetchVideoList() {
            try {
                // Try multiple methods to fetch the JSON
                let data;
                
                // Method 1: Direct fetch (might work if CORS is properly set)
                try {
                    const response = await fetch('https://pjbaldes.github.io/videos.json');
                    if (response.ok) {
                        data = await response.json();
                    }
                } catch (e) {
                    console.log('Direct fetch failed, trying proxy...');
                }
                
                // Method 2: Use CORS proxy if direct fetch failed
                if (!data) {
                    const proxyUrl = 'https://api.allorigins.win/raw?url=';
                    const targetUrl = 'https://pjbaldes.github.io/videos.json';
                    const response = await fetch(proxyUrl + encodeURIComponent(targetUrl));
                    if (response.ok) {
                        data = await response.json();
                    }
                }
                
                // Handle the JSON structure from your endpoint
                if (data && data.videos && Array.isArray(data.videos)) {
                    videoList = data.videos;
                    console.log('Successfully loaded video list:', videoList);
                } else {
                    throw new Error('Invalid JSON structure');
                }
                
                return videoList;
            } catch (error) {
                console.error('Error fetching video list:', error);
                // Fallback to the known videos if all methods fail
                videoList = [
                    "https://pjbaldes.github.io/video/lovecanal_2.mp4",
                    "https://pjbaldes.github.io/video/brooklyn.mp4"
                ];
                console.log('Using fallback video list:', videoList);
                return videoList;
            }
        }
        
        function getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }
        
        function getRandomBlendMode() {
            return getRandomItem(blendModes);
        }
        
        function getRandomVideos() {
            if (videoList.length < 2) return null;
            
            const video1 = getRandomItem(videoList);
            let video2;
            do {
                video2 = getRandomItem(videoList);
            } while (video1 === video2 && videoList.length > 1);
            
            return { video1, video2 };
        }
        
        function applyBlendMode(blendMode) {
            const topVideo = document.getElementById('video2');
            topVideo.style.mixBlendMode = blendMode;
        }
        
        async function loadVideos(video1Url, video2Url) {
            const video1Element = document.getElementById('video1');
            const video2Element = document.getElementById('video2');
            
            return new Promise((resolve, reject) => {
                let loadedCount = 0;
                
                const onLoad = () => {
                    loadedCount++;
                    if (loadedCount === 2) resolve();
                };
                
                const onError = (error) => {
                    console.error('Error loading video:', error);
                    reject(error);
                };
                
                video1Element.addEventListener('loadeddata', onLoad, { once: true });
                video2Element.addEventListener('loadeddata', onLoad, { once: true });
                video1Element.addEventListener('error', onError, { once: true });
                video2Element.addEventListener('error', onError, { once: true });
                
                video1Element.src = video1Url;
                video2Element.src = video2Url;
                
                video1Element.load();
                video2Element.load();
            });
        }
        
        async function loadNewVideos() {
            const loading = document.getElementById('loading');
            const videoContainer = document.getElementById('videoContainer');
            
            loading.style.display = 'block';
            loading.textContent = 'Loading new videos...';
            
            try {
                const randomVideos = getRandomVideos();
                if (!randomVideos) {
                    throw new Error('Not enough videos available');
                }
                
                const { video1, video2 } = randomVideos;
                const blendMode = getRandomBlendMode();
                
                await loadVideos(video1, video2);
                
                applyBlendMode(blendMode);
                
                loading.style.display = 'none';
                videoContainer.style.display = 'block';
                
                // Start playback
                document.getElementById('video1').play();
                document.getElementById('video2').play();
                
            } catch (error) {
                console.error('Error loading videos:', error);
                loading.textContent = 'Error loading videos. Please try again.';
            }
        }
        
        // Initialize
        async function init() {
            const loading = document.getElementById('loading');
            loading.textContent = 'Fetching video list...';
            
            await fetchVideoList();
            console.log('Final video list length:', videoList.length);
            console.log('Video list:', videoList);
            
            if (videoList.length >= 2) {
                await loadNewVideos();
            } else {
                loading.textContent = `Error: Only ${videoList.length} videos found. Need at least 2 videos.`;
                console.error('Not enough videos. Found:', videoList);
            }
        }
        
        // Handle video ended events to restart
        document.addEventListener('DOMContentLoaded', () => {
            const video1 = document.getElementById('video1');
            const video2 = document.getElementById('video2');
            
            video1.addEventListener('ended', () => video1.play());
            video2.addEventListener('ended', () => video2.play());
        });
        
        // Start the app
        init();
    </script>
</body>
</html>
