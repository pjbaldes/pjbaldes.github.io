<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scaling Shapes</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let width, height;
  function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  const colors = ['#000000', '#FFFFFF', '#FF00FF', '#00FFFF', '#FFFF00', '#FF0000', '#00FF00', '#0000FF'];
  function getContrastingColor(currentColor) {
    let otherColors = colors.filter(c => c !== currentColor);
    return otherColors[Math.floor(Math.random() * otherColors.length)];
  }
  function drawShape(type, x, y, size, color, rotation) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.fillStyle = color;
    ctx.beginPath();
    switch(type) {
      case 'square':
        ctx.fillRect(-size/2, -size/2, size, size);
        break;
      case 'circle':
        ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'triangle':
        ctx.moveTo(0, -size/2);
        ctx.lineTo(-size/2, size/2);
        ctx.lineTo(size/2, size/2);
        ctx.closePath();
        ctx.fill();
        break;
      case 'ellipse':
        ctx.ellipse(0, 0, size/2, size/3, 0, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'hexagon':
        for(let i = 0; i < 6; i++) {
          let angle = Math.PI / 3 * i;
          let px = size * Math.cos(angle) / 2;
          let py = size * Math.sin(angle) / 2;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        break;
      case 'pentagon':
        for(let i = 0; i < 5; i++) {
          let angle = 2 * Math.PI / 5 * i - Math.PI / 2;
          let px = size * Math.cos(angle) / 2;
          let py = size * Math.sin(angle) / 2;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        break;
      case 'trapezoid':
        ctx.moveTo(-size/2, size/4);
        ctx.lineTo(size/2, size/4);
        ctx.lineTo(size/4, -size/4);
        ctx.lineTo(-size/4, -size/4);
        ctx.closePath();
        ctx.fill();
        break;
    }
    ctx.restore();
  }
  let currentColor = colors[Math.floor(Math.random() * colors.length)];
  let shapeTypes = ['square', 'circle', 'triangle', 'ellipse', 'hexagon', 'pentagon', 'trapezoid'];
  let shape = null;
  function newShape() {
    const type = shapeTypes[Math.floor(Math.random() * shapeTypes.length)];
    const x = Math.random() * width;
    const y = Math.random() * height;
    const initialSpeed = 0.2 + Math.random() * 0.5;
    const size = 5;
    const color = getContrastingColor(currentColor);
    const rotation = 0;
    const rotationSpeed = (Math.random() * 0.01 + 0.002) * (Math.random() < 0.5 ? 1 : -1);
    shape = { type, x, y, size, speed: initialSpeed, color, rotation, rotationSpeed };
  }
  function animate() {
    ctx.fillStyle = currentColor;
    ctx.fillRect(0, 0, width, height);
    if (!shape) newShape();
    drawShape(shape.type, shape.x, shape.y, shape.size, shape.color, shape.rotation);
    shape.size += shape.speed;
    shape.speed *= 1.01; // gravity-like acceleration
    shape.rotation += shape.rotationSpeed;
    if (shape.size > Math.max(width, height) * 2) {
      currentColor = shape.color;
      shape = null;
    }
    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
